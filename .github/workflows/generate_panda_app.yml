name: Generate Panda App (ros_package branch)

on:
  workflow_dispatch:
    inputs:
      app_pretty_name:
        description: "App pretty name"
        required: true
      github_owner:
        description: "GitHub owner/org"
        required: true
      repo_name:
        description: "Repo name"
        required: true
      description:
        description: "One-line description"
        required: true
      app_short_name:
        description: "Short name (no spaces)"
        required: true
      launch_file:
        description: "Launch file (e.g. app.launch)"
        required: true

permissions:
  contents: write

jobs:
  generate_panda_app:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 2. Fetch all branches
      - name: Fetch branches
        run: git fetch origin

      # 3. Switch to ros_package branch (create if needed)
      - name: Switch to ros_package branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin ros_package; then
            echo "ros_package exists remotely"
            git checkout ros_package
            git pull origin ros_package
          else
            echo "Creating ros_package branch"
            git checkout -b ros_package
          fi

      # 4. Create BLANK launch file if missing
      - name: Ensure launch file exists (blank)
        shell: bash
        run: |
          set -e

          LAUNCH_DIR="launch"
          LAUNCH_FILE="${{ inputs.launch_file }}"
          FULL_PATH="$LAUNCH_DIR/$LAUNCH_FILE"

          mkdir -p "$LAUNCH_DIR"

          if [ ! -f "$FULL_PATH" ]; then
            echo "Creating BLANK launch file: $FULL_PATH"
            : > "$FULL_PATH"
          else
            echo "Launch file already exists: $FULL_PATH"
          fi

      # 5. Download Panda generator script
      - name: Download Panda app script
        run: |
          curl -L \
            https://raw.githubusercontent.com/jmscslgroup/libpanda-default-apps/main/createNewPandaApp.sh \
            -o createNewPandaApp.sh

          chmod +x createNewPandaApp.sh

      # 6. Run generator (interactive script fed via stdin)
      - name: Run Panda app generator
        shell: bash
        run: |
          printf "%s\n%s\n%s\n%s\n%s\n%s\n" \
            "${{ inputs.app_pretty_name }}" \
            "${{ inputs.github_owner }}" \
            "${{ inputs.repo_name }}" \
            "${{ inputs.description }}" \
            "${{ inputs.app_short_name }}" \
            "${{ inputs.launch_file }}" \
          | bash createNewPandaApp.sh

      # 7. Patch YAML (safe insert branch info)
      - name: Append branch_or_hash to ros_package repo
        shell: bash
        run: |
          set -e

          FILE="libpanda-apps.yaml"

          # Ensure file exists
          if [ ! -f "$FILE" ]; then
            echo "Missing $FILE"
            exit 1
          fi

          # Append correctly indented line
          # Assumes last repo entry is "controller"
          awk '
            { print }
            /repo: controller/ {
              getline
              print
              print "          branch_or_hash: ros_package"
            }
          ' "$FILE" > tmp.yaml && mv tmp.yaml "$FILE"

      # 8. Cleanup script
      - name: Remove temporary script
        run: rm -f createNewPandaApp.sh

      # 9. Commit changes
      - name: Commit generated Panda app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Panda app: ${{ inputs.app_short_name }}"

      # 10. Push ros_package branch
      - name: Push ros_package branch
        shell: bash
        run: |
          git push origin ros_package