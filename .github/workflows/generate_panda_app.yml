name: Generate Panda App (ros_package branch)

on:
  workflow_dispatch:
    inputs:
      app_pretty_name:
        description: "App pretty name"
        required: true
      github_owner:
        description: "GitHub owner/org"
        required: true
      repo_name:
        description: "Repo name"
        required: true
      description:
        description: "One-line description"
        required: true
      app_short_name:
        description: "Short name (no spaces)"
        required: true
      launch_file:
        description: "Launch file (e.g. app.launch)"
        required: true

permissions:
  contents: write

jobs:
  generate_panda_app:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout MAIN (workflow source lives here)
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 2. Fetch all branches
      - name: Fetch branches
        run: git fetch origin

      # 3. Switch to ros_package branch (create if needed)
      - name: Switch to ros_package branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin ros_package; then
            echo "ros_package exists remotely"
            git checkout ros_package
            git pull origin ros_package
          else
            echo "Creating ros_package branch"
            git checkout -b ros_package
          fi

      # 4. Ensure launch directory + file exists (SAFE INIT)
      - name: Ensure launch file exists
        shell: bash
        run: |
          set -e

          LAUNCH_DIR="launch"
          LAUNCH_FILE="${{ inputs.launch_file }}"
          FULL_PATH="$LAUNCH_DIR/$LAUNCH_FILE"

          mkdir -p "$LAUNCH_DIR"

          if [ ! -f "$FULL_PATH" ]; then
            echo "Creating missing launch file: $FULL_PATH"

            cat > "$FULL_PATH" <<EOF
            <launch>
                <!-- Auto-generated placeholder launch file -->
            </launch>
            EOF
          else
            echo "Launch file already exists: $FULL_PATH"
          fi

      # 5. Download Panda generator script into repo root
      - name: Download Panda app script
        run: |
          curl -L \
            https://raw.githubusercontent.com/jmscslgroup/libpanda-default-apps/main/createNewPandaApp.sh \
            -o createNewPandaApp.sh

          chmod +x createNewPandaApp.sh

      # 6. Run Panda app generator (non-interactive input)
      - name: Run Panda app generator
        shell: bash
        run: |
          printf "%s\n%s\n%s\n%s\n%s\n%s\n" \
            "${{ inputs.app_pretty_name }}" \
            "${{ inputs.github_owner }}" \
            "${{ inputs.repo_name }}" \
            "${{ inputs.description }}" \
            "${{ inputs.app_short_name }}" \
            "${{ inputs.launch_file }}" \
          | bash createNewPandaApp.sh

      # 7. Cleanup script
      - name: Remove temporary script
        run: rm -f createNewPandaApp.sh

      # 8. Commit generated changes to ros_package
      - name: Commit generated Panda app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Panda app: ${{ inputs.app_short_name }}"

      # 9. Push back to ros_package
      - name: Push ros_package branch
        shell: bash
        run: |
          git push origin ros_package