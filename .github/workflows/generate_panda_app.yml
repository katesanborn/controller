name: Generate Panda App (ros_package branch)

on:
  workflow_dispatch:
    inputs:
      app_pretty_name:
        description: "App pretty name"
        required: true
      github_owner:
        description: "GitHub owner/org"
        required: true
      repo_name:
        description: "Repo name"
        required: true
      description:
        description: "One-line description"
        required: true
      app_short_name:
        description: "Short name (no spaces)"
        required: true
      launch_file:
        description: "Launch file"
        required: true

permissions:
  contents: write

jobs:
  generate_panda_app:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout MAIN (where workflow lives)
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 2. Fetch all branches
      - name: Fetch branches
        run: git fetch origin

      # 3. Switch to ros_package branch (create if missing)
      - name: Switch to ros_package branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin ros_package; then
            echo "ros_package exists remotely"
            git checkout ros_package
            git pull origin ros_package
          else
            echo "Creating ros_package branch"
            git checkout -b ros_package
          fi

      # 4. Download Panda app script to repo root
      - name: Download Panda app script
        run: |
          curl -L \
            https://raw.githubusercontent.com/jmscslgroup/libpanda-default-apps/main/createNewPandaApp.sh \
            -o createNewPandaApp.sh

          chmod +x createNewPandaApp.sh

      # 5. Run script (feed inputs non-interactively)
      - name: Run Panda app generator
        shell: bash
        run: |
          printf "%s\n%s\n%s\n%s\n%s\n%s\n" \
            "${{ inputs.app_pretty_name }}" \
            "${{ inputs.github_owner }}" \
            "${{ inputs.repo_name }}" \
            "${{ inputs.description }}" \
            "${{ inputs.app_short_name }}" \
            "${{ inputs.launch_file }}" \
          | bash createNewPandaApp.sh

      # 6. Cleanup script (optional but good hygiene)
      - name: Remove script
        run: rm -f createNewPandaApp.sh

      # 7. Commit generated app ONLY on ros_package
      - name: Commit Panda app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Panda app: ${{ inputs.app_short_name }}"

      # 8. Push back to ros_package
      - name: Push ros_package branch
        shell: bash
        run: |
          git push origin ros_package